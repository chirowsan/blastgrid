@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
#toast { position: fixed; bottom: 14%; left: 50%; transform: translateX(-50%); background: rgba(10,14,36,.9); border: 1px solid var(--line); border-radius: 99px; padding: 8px 18px; font-weight: 800; z-index: 60; pointer-events: none; opacity: 0; transition: opacity .25s; } #toast.show { opacity: 1; }
.kbd { display: inline-block; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,.1); font-weight: 800; font-size: .9em; box-shadow: 0 2px 0 rgba(0,0,0,.4); }
.howto { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*1); padding: calc(var(--u)*1.1); overflow: auto; flex: 1; align-content: start; } .howto h4 { margin: 0 0 calc(var(--u)*.4); color: var(--acc); text-transform: uppercase; letter-spacing: .12em; font-size: calc(var(--u)*1); } .howto p, .howto li { font-size: calc(var(--u)*1); line-height: 1.5; font-weight: 600; margin: 0; color: #dfe8ff; } .howto ul { padding-left: 1.1em; margin: 0; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*.4) calc(var(--u)*1); } .legend div { display: flex; align-items: center; gap: calc(var(--u)*.5); font-size: calc(var(--u)*.95); font-weight: 700; } .legend img { width: calc(var(--u)*2.4); height: calc(var(--u)*2.4); }
.errbox { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; background: #070b1e; z-index: 99; font-size: 18px; font-weight: 700; }
@media (max-height: 420px) { .title { font-size: calc(var(--u)*4.6); } #menu .left { gap: calc(var(--u)*.5); } .dialog { padding: calc(var(--u)*1) calc(var(--u)*1.6); gap: calc(var(--u)*.6); } .dialog h2 { font-size: calc(var(--u)*2.4); } }
